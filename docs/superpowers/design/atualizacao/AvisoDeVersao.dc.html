<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>PequenaVia — nova versão disponível</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F5F0E6}
a{color:#6E1F24}a:hover{color:#4E1418}
@keyframes nv-subir{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes nv-girar{to{transform:rotate(360deg)}}
@keyframes nv-pulsar{0%,100%{box-shadow:0 0 0 0 rgba(217,185,122,.55)}50%{box-shadow:0 0 0 6px rgba(217,185,122,0)}}
.nv-aviso{animation:nv-subir .5s cubic-bezier(.16,.84,.3,1) .3s both}
.nv-girando{animation:nv-girar .9s linear infinite}
.nv-ponto{animation:nv-pulsar 2s ease-in-out infinite}
.nv-botao:hover{background:#E4C88E}
.nv-depois:hover{color:#F5F0E6}
@media (prefers-reduced-motion: reduce){.nv-aviso,.nv-ponto{animation:none}.nv-girando{animation-duration:2.4s}}
</style>
</helmet>
<div style="position: relative; min-height: 900px; overflow: hidden; background: #F5F0E6; color: #221A17; font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

  <header style="display: flex; align-items: center; gap: 24px; padding: 0 24px; min-height: 64px; background: #FBF8F2; border-bottom: 1px solid #E1D7C8">
    <span style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 999px; background: #F5F0E6; display: flex; align-items: center; justify-content: center"><img src="/_blob/50066c2efa3bd703f79bbba990bb7aa8" alt="" style="width: 28px; height: 28px; object-fit: contain"></span>
      <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 23px; font-weight: 700">PequenaVia</span>
    </span>
    <nav aria-label="Navegação do app" style="display: flex; gap: 4px; flex: 1">
      <span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #6E1F24; font-weight: 600; text-decoration: underline; text-underline-offset: 6px">Início</span>
      <span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #4A3D38; font-weight: 600">Agendamentos</span>
      <span style="display: flex; align-items: center; min-height: 44px; padding: 0 14px; color: #4A3D38; font-weight: 600">Certificados</span>
    </nav>

    <!-- Depois de "Depois": o aviso vira um ponto no topo, que reabre o aviso -->
    <sc-if value="{{ lembrete }}" hint-placeholder-val="{{ false }}">
      <button type="button" onClick="{{ reabrir }}" style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid #E8D7B0; border-radius: 999px; background: #F3E8CF; font: inherit; font-weight: 600; color: #5A4214; cursor: pointer">
        <span class="nv-ponto" aria-hidden="true" style="width: 8px; height: 8px; border-radius: 999px; background: #B8892F"></span>
        Nova versão
      </button>
    </sc-if>

    <span style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #CDBFAC; border-radius: 999px; font-weight: 600">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M8.5 11h7M8.5 14h4"/></svg>
      Assistente
    </span>
  </header>

  <!-- O Início, atrás do aviso -->
  <main aria-hidden="true" style="width: 100%; max-width: 1280px; margin: 0 auto; padding: 28px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="border-radius: 22px; background: #221A17; color: #F5F0E6; padding: 28px 30px; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #D9B97A">Quinta, 15 de outubro</span>
      <span style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 46px; font-weight: 600; line-height: 1">Boa tarde, Ana.</span>
      <span style="color: #D8CEC2; font-size: 16px">4 reservas hoje e 2 pedidos esperando resposta.</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
      <div style="height: 360px; border-radius: 18px; background: #FBF8F2; border: 1px solid #E1D7C8"></div>
      <div style="height: 360px; border-radius: 18px; background: #FBF8F2; border: 1px solid #E1D7C8"></div>
    </div>
  </main>

  <!-- O aviso: pílula escura centralizada embaixo -->
  <sc-if value="{{ aberto }}" hint-placeholder-val="{{ true }}">
    <section class="nv-aviso" role="status" aria-live="polite" aria-label="{{ texto }}" style="position: absolute; left: 24px; bottom: 24px; width: max-content; max-width: calc(100% - 48px); box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 4px 4px 4px 14px; border-radius: 999px; background: #221A17; color: #F5F0E6; box-shadow: 0 12px 32px rgba(34, 26, 23, 0.3)">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D9B97A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/></svg>
      <b style="font-weight: 600; white-space: nowrap">{{ titulo }}</b>
      <sc-if value="{{ podeAdiar }}" hint-placeholder-val="{{ true }}">
        <button type="button" class="nv-depois" onClick="{{ adiar }}" style="min-height: 36px; padding: 0 10px; border: none; border-radius: 999px; background: transparent; font: inherit; font-weight: 600; color: #BFB3A8; cursor: pointer">Depois</button>
      </sc-if>
      <button type="button" class="nv-botao" onClick="{{ atualizar }}" disabled="{{ atualizando }}" style="display: flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border: none; border-radius: 999px; background: #D9B97A; font: inherit; font-weight: 600; color: #221A17; cursor: pointer">
        <svg class="{{ classeDoIcone }}" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        {{ rotuloDoBotao }}
      </button>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"situacao":{"editor":"enum","options":["livre","editando"],"default":"livre"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { estado: 'aberto' };
  }

  componentWillUnmount() {
    clearTimeout(this.volta);
  }

  renderVals() {
    var self = this;
    var estado = this.state.estado;
    var editando = (this.props.situacao ?? 'livre') === 'editando';
    var atualizando = estado === 'atualizando';

    return {
      aberto: estado !== 'adiado',
      lembrete: estado === 'adiado',
      atualizando: atualizando,
      podeAdiar: !atualizando,
      titulo: atualizando ? 'Atualizando…' : (editando ? 'Nova versão · salve antes' : 'Nova versão disponível'),
      texto: atualizando
        ? 'Recarregando a página.'
        : (editando
          ? 'Nova versão disponível. Salve o que está editando antes de atualizar.'
          : 'Nova versão disponível. Atualize para usar a mais recente.'),
      rotuloDoBotao: atualizando ? 'Atualizando' : 'Atualizar',
      classeDoIcone: atualizando ? 'nv-girando' : '',
      atualizar: function () {
        self.setState({ estado: 'atualizando' });
        clearTimeout(self.volta);
        // No site, aqui a página recarrega. Na prévia, volta ao aviso para poder repetir.
        self.volta = setTimeout(function () { self.setState({ estado: 'aberto' }); }, 2200);
      },
      adiar: function () { self.setState({ estado: 'adiado' }); },
      reabrir: function () { self.setState({ estado: 'aberto' }); }
    };
  }
}
</script>
</body>
</html>
