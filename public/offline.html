<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light" />
        <title>Sem internet - PequenaVia</title>
        <style>
            body {
                margin: 0;
                min-height: 100svh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                box-sizing: border-box;
                background: #f5f0e6;
                color: #221a17;
                font-family: system-ui, sans-serif;
                text-align: center;
            }
            main {
                max-width: 360px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            img {
                width: 96px;
                height: 96px;
                border-radius: 24px;
            }
            h1 {
                margin: 8px 0 0;
                font-family: Georgia, serif;
                font-size: 28px;
                font-weight: 600;
            }
            p {
                margin: 0;
                color: #6b5d57;
                line-height: 1.5;
            }
            button {
                margin-top: 12px;
                min-height: 44px;
                padding: 0 20px;
                border: none;
                border-radius: 10px;
                background: #6e1f24;
                color: #fbf8f2;
                font: inherit;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/icons/icon-192.png" alt="" />
            <h1>Você está sem internet</h1>
            <p>
                O PequenaVia precisa de conexão para mostrar a agenda e os
                certificados. Confira o Wi-Fi ou os dados móveis e tente de
                novo.
            </p>
            <button type="button" onclick="location.reload()">
                Tentar de novo
            </button>
        </main>
    </body>
</html>
