# Stack Swarm do PequenaVia (Laravel). Variáveis obrigatórias (definir no Portainer):
#   APP_KEY, DB_PASSWORD, S3_ACCESS_KEY, S3_SECRET_KEY,
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM_ADDRESS
# Opcionais: VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY (notificações no celular; gere com `php artisan push:gerar-chaves`).
# Antes do primeiro deploy: publicar a imagem (docker push jpbetanza/pequenavia-laravel:latest).

x-app-env: &app-env
    APP_NAME: PequenaVia
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY}
    APP_URL: https://certificados.pequenavia.app.br
    APP_LOCALE: pt_BR
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: '5432'
    DB_DATABASE: pequenavia
    DB_USERNAME: pequenavia
    DB_PASSWORD: ${DB_PASSWORD}
    SESSION_DRIVER: database
    SESSION_SECURE_COOKIE: 'true'
    QUEUE_CONNECTION: database
    CACHE_STORE: database
    FILESYSTEM_DISK: local
    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_DEFAULT_REGION: us-east-1
    AWS_BUCKET: modelos-certificado
    AWS_ENDPOINT: http://rustfs:9000
    AWS_USE_PATH_STYLE_ENDPOINT: 'true'
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    GOOGLE_REDIRECT_URI: https://certificados.pequenavia.app.br/auth/google/callback
    MAIL_MAILER: smtp
    MAIL_HOST: ${MAIL_HOST}
    MAIL_PORT: ${MAIL_PORT}
    MAIL_USERNAME: ${MAIL_USERNAME}
    MAIL_PASSWORD: ${MAIL_PASSWORD}
    VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
    VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    VAPID_SUBJECT: https://certificados.pequenavia.app.br
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
    MAIL_FROM_NAME: PequenaVia

services:
    app:
        image: jpbetanza/pequenavia-laravel:latest
        command: ['web']
        environment: *app-env
        networks:
            - network_swarm_public
            - interna
        healthcheck:
            test:
                ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:8080/up']
            interval: 15s
            timeout: 5s
            retries: 3
            start_period: 60s
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: on-failure
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first
                failure_action: rollback
                monitor: 30s
            rollback_config:
                parallelism: 1
                delay: 5s
                order: start-first
            labels:
                - 'com.centurylinklabs.watchtower.enable=true'
                - 'traefik.enable=true'
                - 'traefik.docker.network=network_swarm_public'
                - 'traefik.http.routers.pequenavia-laravel.rule=Host(`certificados.pequenavia.app.br`)'
                - 'traefik.http.routers.pequenavia-laravel.entrypoints=websecure'
                - 'traefik.http.routers.pequenavia-laravel.tls=true'
                - 'traefik.http.routers.pequenavia-laravel.tls.certresolver=letsencryptresolver'
                - 'traefik.http.routers.pequenavia-laravel.service=pequenavia-laravel'
                - 'traefik.http.services.pequenavia-laravel.loadbalancer.server.port=8080'

    queue:
        image: jpbetanza/pequenavia-laravel:latest
        command: ['queue']
        environment: *app-env
        networks:
            - interna
        # O worker não serve HTTP; o HEALTHCHECK herdado da imagem (/up) ficaria unhealthy.
        healthcheck:
            disable: true
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: any
            labels:
                - 'com.centurylinklabs.watchtower.enable=true'

    scheduler:
        image: jpbetanza/pequenavia-laravel:latest
        command: ['scheduler']
        environment: *app-env
        networks:
            - interna
        # O scheduler não serve HTTP; o HEALTHCHECK herdado da imagem (/up) ficaria unhealthy.
        healthcheck:
            disable: true
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: any
            labels:
                - 'com.centurylinklabs.watchtower.enable=true'

    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: pequenavia
            POSTGRES_USER: pequenavia
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - pequenavia_pg:/var/lib/postgresql/data
        networks:
            - interna
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U pequenavia']
            interval: 10s
            retries: 10
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: on-failure

    rustfs:
        image: rustfs/rustfs:1.0.1
        # O volume precisa pertencer ao uid 10001; ver o serviço rustfs-perms.
        environment:
            RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
            RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
            RUSTFS_ADDRESS: ':9000'
            RUSTFS_CONSOLE_ENABLE: 'false'
        volumes:
            - pequenavia_s3:/data
        networks:
            - interna
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: on-failure

    rustfs-perms:
        image: alpine:3
        user: root
        command: chown -R 10001:10001 /data
        volumes:
            - pequenavia_s3:/data
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: none

    s3-init:
        image: amazon/aws-cli:latest
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
            AWS_DEFAULT_REGION: us-east-1
        entrypoint: >
            /bin/sh -c "
            until aws --endpoint-url http://rustfs:9000 s3api list-buckets; do sleep 3; done;
            aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket modelos-certificado
            || aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket modelos-certificado;
            "
        networks:
            - interna
        deploy:
            mode: replicated
            replicas: 1
            restart_policy:
                condition: none

volumes:
    pequenavia_pg:
    pequenavia_s3:

networks:
    network_swarm_public:
        external: true
        name: network_swarm_public
    interna:
        driver: overlay
